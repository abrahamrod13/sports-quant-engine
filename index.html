<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MLB Picks Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: Arial; padding: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { background: #161b22; border: 1px solid #e94560; border-radius: 15px; padding: 20px; text-align: center; min-width: 150px; }
        .card h3 { color: #8b949e; font-size: 0.8rem; margin-bottom: 10px; }
        .card .value { color: #e94560; font-size: 2rem; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 15px; overflow: hidden; }
        th { background: #1a1a2e; color: #e94560; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #30363d; }
        .win { color: #3fb950; }
        .loss { color: #f85149; }
        .pending { color: #d2991d; }
        button { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>⚾ MLB PICKS TRACKER</h1>
    
    <div class="stats" id="stats"></div>
    
    <button onclick="cargarDatos()">🔄 ACTUALIZAR AHORA</button>
    
    <table id="tabla">
        <thead><tr><th>Fecha</th><th>Juego</th><th>Pick</th><th>Edge</th><th>Resultado</th></tr></thead>
        <tbody id="cuerpo"></tbody>
    </table>

    <script>
        const SHEET_ID = '2PACX-1vTGjYruLi1eQRwKI0t06UA6zpIzS1ufZC4gJkibPqhn6J3sa1_kieCGfy8KIi1XlZVALztgt89uUf1t';
        let datos = [];

        async function cargarDatos() {
            document.getElementById('cuerpo').innerHTML = '<tr><td colspan="5">Cargando...</td></tr>';
            
            // Usar Google Sheets API (pública)
            const url = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?output=csv`;
            
            try {
                const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
                const csvText = await response.text();
                
                const lines = csvText.split('\n');
                const headers = lines[0].split(',');
                
                datos = [];
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = lines[i].split(',');
                    if (values.length >= 5) {
                        datos.push({
                            date: values[0],
                            match: values[1],
                            pick: values[2],
                            edge: parseFloat(values[3]),
                            result: values[4]
                        });
                    }
                }
                
                actualizarTabla();
                actualizarStats();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('cuerpo').innerHTML = '<tr><td colspan="5">Error cargando datos. Click en "ACTUALIZAR AHORA"</td></tr>';
            }
        }

        function actualizarTabla() {
            const tbody = document.getElementById('cuerpo');
            tbody.innerHTML = '';
            
            datos.slice().reverse().forEach(p => {
                const row = tbody.insertRow();
                row.insertCell(0).innerHTML = p.date;
                row.insertCell(1).innerHTML = p.match;
                row.insertCell(2).innerHTML = p.pick;
                row.insertCell(3).innerHTML = p.edge + '%';
                row.insertCell(4).innerHTML = `<span class="${p.result.toLowerCase()}">${p.result || 'PENDING'}</span>`;
            });
        }

        function actualizarStats() {
            const completados = datos.filter(p => p.result === 'WIN' || p.result === 'LOSS');
            const wins = completados.filter(p => p.result === 'WIN').length;
            const total = completados.length;
            const winRate = total > 0 ? (wins / total * 100).toFixed(1) : 0;
            
            document.getElementById('stats').innerHTML = `
                <div class="card"><h3>TOTAL PICKS</h3><div class="value">${total}</div></div>
                <div class="card"><h3>WINS</h3><div class="value">${wins}</div></div>
                <div class="card"><h3>LOSSES</h3><div class="value">${total - wins}</div></div>
                <div class="card"><h3>WIN RATE</h3><div class="value">${winRate}%</div></div>
            `;
        }

        cargarDatos();
        setInterval(cargarDatos, 30000);
    </script>
</body>
</html>
